<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Busca la Pareja</title>
  <link rel="stylesheet" href="juego3.css">
</head>
<body>

  <div class="juego">
    <div class="juego-header">
      <h3>Busca la pareja</h3>
    </div>
    <p>Encuentra todos los pares en el menor número de intentos.</p>

    <div class="juego-stats">
      <span>Movimientos: <strong id="movimientosJuego3">0</strong></span>
      <span>Tiempo: <strong id="tiempoJuego3">0s</strong></span>
    </div>

    <div class="tablero" id="tableroJuego3"></div>

    <div class="mensaje-victoria" id="mensajeJuego3"></div>
    <button class="btn-accion" id="btnReiniciarJuego3">Reiniciar juego</button>
  </div>

  <script src="juego3.js"></script>
</body>
</html>
